
services:
  mongodb:
    image: mongo:8
    container_name: unisphere-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"

  backend:
    image: unisphere-backend:latest
    container_name: unisphere-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/unisphere
      CLIENT_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    ports:
      - "5000:5000"
    depends_on:
      - mongodb

  frontend:
    image: unisphere-frontend:latest
    container_name: unisphere-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongodb_data:
